name: Yeni bağlantı öner
description: Dizine eklenmesini istediğin bir kaynak / Suggest a link for the directory
title: "[link] "
labels: ["yeni-bağlantı"]
body:
  - type: markdown
    attributes:
      value: |
        Teşekkürler. Dizine giren her kaydın **ne işe yaradığı** ve
        **benzerlerinden nerede ayrıldığı** yazılı olmak zorunda — o yüzden
        aşağıdaki iki alanı doldurman gerekiyor.

        Every entry in this directory has to say what the thing does and where
        it differs from its neighbours, so both fields below are required.

  - type: input
    id: url
    attributes:
      label: URL
      placeholder: https://…
    validations:
      required: true

  - type: input
    id: name
    attributes:
      label: İsim / Name
      placeholder: Kısa, ürünün kendi adı
    validations:
      required: true

  - type: dropdown
    id: cat
    attributes:
      label: Kategori / Category
      options:
        - Öğrenme & Yol Haritaları
        - Pratik & Alıştırma
        - Programlama Dilleri
        - Web & Frontend
        - Backend, API & Sistem Tasarımı
        - Mobil & Masaüstü
        - Veritabanı
        - DevOps & Altyapı
        - Ağ & Sistem Yönetimi
        - Güvenlik & Gizlilik
        - Veri Bilimi & Makine Öğrenmesi
        - YZ · Modeller & Asistanlar
        - YZ · Agent, RAG & Altyapı
        - YZ · Uygulama Araçları
        - Donanım, CAD & Gömülü
        - Akıllı Gözlük & Giyilebilir
        - Kuantum Bilişim
        - Araçlar & Yardımcılar
        - Referans & Koleksiyonlar
        - Bilim & Akademik
        - Emin değilim
    validations:
      required: true

  - type: textarea
    id: what
    attributes:
      label: Ne işe yarıyor? / What does it do?
      description: Bir iki cümle. Pazarlama metni değil, ne yaptığı.
      placeholder: |
        Örnek: PostgreSQL'e vektör tipi ve HNSW indeksi ekleyen uzantı.
    validations:
      required: true

  - type: textarea
    id: diff
    attributes:
      label: Benzerlerinden farkı ne? / How does it differ?
      description: >
        Bu alan dizinin tek gerçek değeri. Aynı işi yapan başka bir şeye
        karşı neden bu? Bilmiyorsan boş bırakma, "bilmiyorum" yaz —
        araştırırım.
      placeholder: |
        Örnek: Ayrı bir vektör veritabanı işletmek yerine vektörü ilişkisel
        veriyle aynı işlemde tutabiliyorsun.
    validations:
      required: true

  - type: checkboxes
    id: kontrol
    attributes:
      label: Kontrol
      options:
        - label: Bağlantı şu an açılıyor / The link currently resolves
          required: true
        - label: Hesaba bağlı bir panel ya da kişisel dosya değil
          required: true
